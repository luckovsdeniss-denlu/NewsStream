name: Build APK

# Builds run only on request (Actions -> Build APK -> Run workflow), not on every push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the GitHub Release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
      - name: Name APK with version
        run: cp app/build/outputs/apk/release/app-release.apk NewsPlatform-0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewsPlatform-0.1.${{ github.run_number }}
          path: NewsPlatform-0.1.${{ github.run_number }}.apk
      - name: Publish GitHub Release
        run: |
          gh release create "v0.1.${{ github.run_number }}" "NewsPlatform-0.1.${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "NewsPlatform 0.1.${{ github.run_number }}" \
            --notes-file .github/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
