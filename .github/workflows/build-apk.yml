name: Build APK

# Builds run only on request (Actions -> Build APK -> Run workflow), not on every push.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          VK_SERVICE_TOKEN: ${{ secrets.VK_SERVICE_TOKEN }}
      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk NewsStream-0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NewsStream-0.1.${{ github.run_number }}
          path: NewsStream-0.1.${{ github.run_number }}.apk
